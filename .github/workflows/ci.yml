name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm exec --offline -- playwright install --with-deps chromium
      - run: npm test
      - run: node scripts/package-smoke.mjs

  react-demo:
    name: Published React demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/react-launch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/react-launch/package-lock.json
      - run: npm ci
      - run: npm exec --offline -- playwright install --with-deps chromium
      - run: npm run demo

  composite-action:
    name: Composite action with published CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - name: Start fixture
        run: |
          node examples/preview.mjs >"$RUNNER_TEMP/preview.log" 2>&1 &
          printf '%s\n' '{"baseUrl":"http://127.0.0.1:3000","checks":{"links":false,"accessibility":false}}' >"$RUNNER_TEMP/qa-action-config.json"
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --max-time 5 http://127.0.0.1:3000/ >/dev/null
      - id: qa
        uses: ./
        with:
          config: ${{ runner.temp }}/qa-action-config.json
          url: http://127.0.0.1:3000
          fail-on: warning
          report-dir: qa-guardian-reports
          install-chromium: 'false'
      - name: Check outputs
        env:
          QA_EXIT: ${{ steps.qa.outputs.exit-code }}
        run: |
          test "$QA_EXIT" = 0
          test -s qa-guardian-reports/qa-guardian-report.json
