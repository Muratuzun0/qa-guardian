name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested package to the public npm registry
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/package-smoke.mjs'

permissions:
  contents: read

concurrency:
  group: npm-package-${{ github.repository }}
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm exec --offline -- playwright install --with-deps chromium
      - run: npm test
      - run: node scripts/package-smoke.mjs
        env:
          QA_GUARDIAN_PACK_OUTPUT: ${{ runner.temp }}/qa-guardian.tgz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-package
          path: ${{ runner.temp }}/qa-guardian.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm supports trusted publishing
        run: |
          npm --version
          npm --version | node -e '
            const [major, minor, patch] = require("node:fs").readFileSync(0, "utf8").trim().split(".").map(Number);
            if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
              console.error("npm Trusted Publishing requires npm 11.5.1 or newer.");
              process.exit(1);
            }
          '
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: npm-package
      - run: npm publish ./qa-guardian.tgz --access public --registry https://registry.npmjs.org
